# Netlify Configuration for SecureTrace Frontend
[build]
  publish = "dist"
  command = "npm run build"

# Proxy all /api requests to production backend
[[redirects]]
  from = "/api/*"
  to = "https://securetrace-api.securedapp.io/api/:splat"
  status = 200
  force = true

# Single Page App fallback routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
